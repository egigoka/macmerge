name: MacMerge

on:
  push:
    branches: [master, macos-port]
    paths:
      - "MacMerge/**"
      - "Externals/xdiff/**"
      - ".github/workflows/macmerge.yml"
      - "todo.md"
  pull_request:
    branches: [master]
    paths:
      - "MacMerge/**"
      - "Externals/xdiff/**"
      - ".github/workflows/macmerge.yml"
      - "todo.md"

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: macos-15
    defaults:
      run:
        working-directory: MacMerge

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Test
        run: swift test -Xswiftc -warnings-as-errors

      - name: Test native core with Address Sanitizer
        run: swift test --sanitize address -Xswiftc -warnings-as-errors

      - name: Build release
        run: swift build -c release -Xswiftc -warnings-as-errors

      - name: Benchmark large text comparisons
        run: swift run -c release MacMergeBenchmark > benchmark.csv

      - name: Benchmark dense text comparisons
        run: swift run -c release MacMergeBenchmark --lines 100000 --density dense > benchmark-dense.csv

      - name: Benchmark long-line text comparisons
        run: swift run -c release MacMergeBenchmark --lines 10000 --line-bytes 4096 > benchmark-long-lines.csv

      - name: Benchmark tab and wide-Unicode comparisons
        run: |
          swift run -c release MacMergeBenchmark --lines 100000 --content tabs --line-bytes 128 > benchmark-tabs.csv
          swift run -c release MacMergeBenchmark --lines 100000 --content wide-unicode --line-bytes 128 > benchmark-wide-unicode.csv

      - name: Package application
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: Scripts/package-app.sh

      - name: Enforce packaged-app performance budgets
        env:
          SKIP_PACKAGE: 1
        run: Scripts/run-performance-budgets.sh

      - name: Enforce packaged tab performance budgets
        env:
          SKIP_PACKAGE: 1
          LINE_COUNT: 100000
          FIXTURE_CONTENT: tabs
          FIXTURE_LINE_BYTES: 128
          REPORT_PATH: ${{ github.workspace }}/MacMerge/dist/performance-tabs-report.json
        run: Scripts/run-performance-budgets.sh

      - name: Enforce packaged wide-Unicode performance budgets
        env:
          SKIP_PACKAGE: 1
          LINE_COUNT: 100000
          FIXTURE_CONTENT: wide-unicode
          FIXTURE_LINE_BYTES: 128
          REPORT_PATH: ${{ github.workspace }}/MacMerge/dist/performance-wide-unicode-report.json
        run: Scripts/run-performance-budgets.sh

      - name: Capture packaged-app performance trace
        env:
          SKIP_PACKAGE: 1
        run: |
          if xcrun --find xctrace >/dev/null 2>&1; then
            Scripts/run-performance-trace.sh
          else
            echo "xctrace unavailable; skipping Instruments artifact"
          fi

      - name: Verify application bundle
        run: |
          plutil -lint dist/MacMerge.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 dist/MacMerge.app
          test -x dist/MacMerge.app/Contents/MacOS/MacMerge

      - name: Create artifact
        run: ditto -c -k --keepParent dist/MacMerge.app dist/MacMerge.zip

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: MacMerge-${{ runner.arch }}
          path: |
            MacMerge/dist/MacMerge.zip
            MacMerge/benchmark.csv
            MacMerge/benchmark-dense.csv
            MacMerge/benchmark-long-lines.csv
            MacMerge/benchmark-tabs.csv
            MacMerge/benchmark-wide-unicode.csv
            MacMerge/dist/performance-report.json
            MacMerge/dist/performance-tabs-report.json
            MacMerge/dist/performance-wide-unicode-report.json
            MacMerge/dist/MacMerge-performance.trace
            MacMerge/dist/performance-trace-report.json
          if-no-files-found: error
